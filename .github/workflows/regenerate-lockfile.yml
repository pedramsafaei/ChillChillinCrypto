name: Regenerate Package Lock File

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - fix/package-lock  # Trigger on specific branch

jobs:
  regenerate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Display Node and npm versions
      run: |
        node --version
        npm --version
    
    - name: Backup existing lock file
      run: |
        if [ -f package-lock.json ]; then
          echo "Backing up existing package-lock.json..."
          cp package-lock.json package-lock.json.backup.$(date +%Y%m%d_%H%M%S)
        fi
    
    - name: Remove old lock file
      run: |
        rm -f package-lock.json
        echo "Removed old package-lock.json"
    
    - name: Clean npm cache
      run: npm cache clean --force
    
    - name: Remove node_modules
      run: |
        if [ -d node_modules ]; then
          echo "Removing node_modules..."
          rm -rf node_modules
        fi
    
    - name: Regenerate package-lock.json
      run: |
        echo "Regenerating package-lock.json..."
        npm install
    
    - name: Verify regeneration
      run: |
        echo "Verifying package-lock.json..."
        if [ ! -f package-lock.json ]; then
          echo "ERROR: package-lock.json was not created!"
          exit 1
        fi
        
        FILE_SIZE=$(wc -c < package-lock.json)
        echo "New package-lock.json size: $FILE_SIZE bytes"
        
        if [ "$FILE_SIZE" -lt 10000 ]; then
          echo "ERROR: package-lock.json is too small!"
          exit 1
        fi
        
        echo "✅ package-lock.json regenerated successfully"
    
    - name: Run verification script
      run: |
        chmod +x verify-lock-file.sh
        ./verify-lock-file.sh || true
    
    - name: Test with npm ci
      run: |
        echo "Testing npm ci with new lock file..."
        rm -rf node_modules
        npm ci
    
    - name: Run tests
      run: npm test
    
    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Commit regenerated lock file
      run: |
        git add package-lock.json
        
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "fix: regenerate package-lock.json to resolve CI/CD pipeline failures

          - Removed corrupted package-lock.json with missing dependencies
          - Regenerated lock file using npm install with clean cache
          - Fixed version mismatches (colorette and others)
          - Verified all dependencies are properly locked
          
          This resolves CI/CD test failures in Node.js environments.
          
          Generated by: .github/workflows/regenerate-lockfile.yml"
          
          echo "✅ Changes committed"
        fi
    
    - name: Push changes
      run: |
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Create summary
      run: |
        echo "## Package Lock File Regeneration Complete ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The package-lock.json file has been successfully regenerated and committed." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Changes:" >> $GITHUB_STEP_SUMMARY
        echo "- Removed corrupted lock file" >> $GITHUB_STEP_SUMMARY
        echo "- Generated fresh package-lock.json" >> $GITHUB_STEP_SUMMARY
        echo "- Verified all dependencies" >> $GITHUB_STEP_SUMMARY
        echo "- Tested with npm ci" >> $GITHUB_STEP_SUMMARY
        echo "- Ran test suite" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### File size:" >> $GITHUB_STEP_SUMMARY
        ls -lh package-lock.json | awk '{print "- package-lock.json: " $5}' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Merge this branch to main" >> $GITHUB_STEP_SUMMARY
        echo "2. CI/CD pipeline should now pass" >> $GITHUB_STEP_SUMMARY
        echo "3. Monitor subsequent builds" >> $GITHUB_STEP_SUMMARY
